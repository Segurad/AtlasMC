master-connection:
  name: master-connection
  type: EPOLL
  host: localhost
  port: 666
  worker-threads: 2
  boss-threads: 1
  channel-options:
    SO_BACKLOG: 128
  child-channel-options:
    SO_KEEPALIVE: true
  mode: open
  connection-config:
  - ==type: de.atlasmc.network.player.PlayerConnectionConfig
    name: node-connection
    timeout: 600
    rate-limit: 20
    enable-encryption: true # enables transport encryption for the connection
    authentication: true # authenticate players when join from external (online mode)
    enable-compression: false # network compression
    compression-threshold: 1024
    compression-buffer-size: 4096